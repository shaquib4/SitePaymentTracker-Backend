# ==============================================================================
# Render Infrastructure-as-Code Blueprint for KEPaymentTracker Backend
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: kepaymenttracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        value: "Host=aws-0-ap-southeast-2.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.hbstkhenoocozepiusmw;Password=Usman$887517;SSL Mode=Require;Trust Server Certificate=true;"
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: EnterprisePaymentSystem
      - key: Jwt__Audience
        value: EnterprisePaymentSystemClient
      - key: Database__UsePostgres
        value: "true"
      - key: Email__PublicApiBaseUrl
        value: "https://sitepaymenttracker-backend.onrender.com"
      - key: Email__FrontendUrl
        value: "https://site-payment-tracker-frontend.vercel.app"
      - key: Email__FromName
        value: "Khan Enterprises Audit"
      - key: Email__ResendApiKey
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__SmtpUser
        sync: false
      - key: Email__SmtpPassword
        sync: false
      - key: Email__FromAddress
        sync: false

