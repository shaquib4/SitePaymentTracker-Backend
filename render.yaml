# ==============================================================================
# Render Infrastructure-as-Code Blueprint for KEPaymentTracker Backend
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: kepaymenttracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: kepayment-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: EnterprisePaymentSystem
      - key: Jwt__Audience
        value: EnterprisePaymentSystemClient
      - key: Database__UsePostgres
        value: "true"

databases:
  - name: kepayment-db
    databaseName: kepayment_db
    user: postgres
    plan: free
    region: oregon

